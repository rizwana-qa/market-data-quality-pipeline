


name: Daily Market Analysis

# 12:00 UTC is 04:00 PM in Dubai (UTC+4).
# A run can also be started manually from the Actions tab.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

# One run at a time. A run that has started is never cancelled.
concurrency:
  group: daily-market-analysis
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  daily-analysis:
    name: Analyse, publish to Google Sheets, report
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out the repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        timeout-minutes: 3

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
        timeout-minutes: 5

      - name: Install dependencies
        id: install_dependencies
        timeout-minutes: 5
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run the test suites
        id: tests
        timeout-minutes: 15
        run: |
          python3 tests/run_all.py

      - name: Remove stale generated files from the runner workspace
        id: clear_stale_outputs
        timeout-minutes: 2
        run: |
          rm -f reports/report_*.md reports/report_*_data.csv reports/dashboard_*.html

      - name: Run the Bitcoin and Ethereum analysis
        id: analysis
        timeout-minutes: 10
        run: |
          python3 src/run_workflow.py

      - name: Validate the report and CSV
        id: validate_outputs
        timeout-minutes: 3
        run: |
          python3 src/daily_automation.py validate --reports-dir reports

      - name: Build the HTML dashboard from this run's CSV
        id: build_dashboard
        timeout-minutes: 5
        run: |
          mkdir -p dashboard_out
          python3 src/dashboard.py --reports-dir reports --out-dir dashboard_out

      - name: Check and stage the report, CSV and dashboard
        id: stage_deliverables
        env:
          ANALYSIS_DATE: ${{ steps.validate_outputs.outputs.analysis_date }}
        timeout-minutes: 3
        run: |
          python3 src/daily_automation.py stage-deliverables --reports-dir reports --dashboard-dir dashboard_out \
            --out-dir deliverables --date "$ANALYSIS_DATE"

      # Prepare the standalone HTML dashboard for GitHub Pages.
      - name: Prepare standalone dashboard download for GitHub Pages
        id: prepare_pages
        env:
          ANALYSIS_DATE: ${{ steps.validate_outputs.outputs.analysis_date }}
        timeout-minutes: 3
        run: |
          set -euo pipefail

          if [[ ! "$ANALYSIS_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Invalid or missing analysis date: '$ANALYSIS_DATE'"
            exit 1
          fi

          mapfile -t dashboards < <(
            find dashboard_out -maxdepth 1 -type f -name '*.html' -print | sort
          )

          if [[ "${#dashboards[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one HTML dashboard; found ${#dashboards[@]}."
            printf '%s\n' "${dashboards[@]}"
            exit 1
          fi

          TARGET_DIR="pages-site/reports/${ANALYSIS_DATE}"
          mkdir -p "$TARGET_DIR"

          cp "${dashboards[0]}" "$TARGET_DIR/dashboard.html"

          cat > "$TARGET_DIR/index.html" <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="robots" content="noindex">
            <title>Daily Market Analysis | Dashboard download</title>
            <style>
              body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 24px;
                box-sizing: border-box;
                background: #f4f6f9;
                color: #172033;
                font: 16px/1.55 Arial, Helvetica, sans-serif;
              }
              main {
                width: min(100%, 560px);
                box-sizing: border-box;
                padding: 36px;
                border: 1px solid #e1e6ee;
                border-radius: 16px;
                background: #fff;
                box-shadow: 0 12px 36px rgba(20, 35, 60, .08);
              }
              h1 {
                margin: 0 0 12px;
                font-size: 25px;
              }
              p {
                color: #526078;
              }
              a {
                display: inline-block;
                margin-top: 12px;
                padding: 13px 20px;
                border-radius: 8px;
                background: #173b70;
                color: #fff;
                font-weight: 700;
                text-decoration: none;
              }
            </style>
          </head>
          <body>
            <main>
              <h1>Your market dashboard is ready</h1>
              <p id="status">
                Preparing your standalone HTML dashboard download...
              </p>

              <a id="download"
                 href="./dashboard.html"
                 download="Daily_Market_Analysis.html">
                Download Dashboard Report
              </a>
            </main>

            <script>
              (async function () {
                const link = document.getElementById('download');
                const status = document.getElementById('status');

                try {
                  const response = await fetch('./dashboard.html', {
                    cache: 'no-store'
                  });

                  if (!response.ok) {
                    throw new Error('Dashboard retrieval failed.');
                  }

                  const blob = await response.blob();
                  const objectUrl = URL.createObjectURL(blob);

                  link.href = objectUrl;
                  link.download = 'Daily_Market_Analysis.html';

                  status.textContent =
                    'Your download should start automatically. If it does not, use the button below.';

                  link.click();

                  window.setTimeout(
                    () => URL.revokeObjectURL(objectUrl),
                    60000
                  );

                } catch (error) {
                  status.textContent =
                    'Automatic download was unavailable. Use the button below to open or save the dashboard.';
                }
              })();
            </script>
          </body>
          </html>
          HTML

      - name: Publish dashboard to GitHub Pages
        id: publish_pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./pages-site
          keep_files: true
          commit_message: "Publish market dashboard for ${{ steps.validate_outputs.outputs.analysis_date }}"
        timeout-minutes: 3

      - name: Build the sheet payloads
        id: build_payload
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        timeout-minutes: 3
        run: |
          python3 src/daily_automation.py build-payload --reports-dir reports --out-dir automation_out \
            --run-id "$GITHUB_RUN_ID" --run-url "$RUN_URL"

      - name: Write the rows to Google Sheets
        id: post_to_sheet
        env:
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          GOOGLE_APPS_SCRIPT_TOKEN: ${{ secrets.GOOGLE_APPS_SCRIPT_TOKEN }}
        timeout-minutes: 8
        run: |
          python3 -I -S src/daily_automation.py post --action upsert_analysis --dir automation_out

      - name: Verify the rows in Google Sheets
        id: verify_sheet
        env:
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          GOOGLE_APPS_SCRIPT_TOKEN: ${{ secrets.GOOGLE_APPS_SCRIPT_TOKEN }}
        timeout-minutes: 8
        run: |
          python3 -I -S src/daily_automation.py post --action verify_analysis --dir automation_out

      - name: Upload the report, CSV and dashboard
        id: upload_deliverables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daily-market-analysis-deliverables-${{ github.run_id }}-${{ github.run_attempt }}
          path: deliverables/
          retention-days: 14
          if-no-files-found: error
        timeout-minutes: 5

      - name: Send the success email
        id: send_success_email
        env:
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          GOOGLE_APPS_SCRIPT_TOKEN: ${{ secrets.GOOGLE_APPS_SCRIPT_TOKEN }}
          ARTIFACT_URL: ${{ steps.upload_deliverables.outputs.artifact-url }}
        timeout-minutes: 8
        run: |
          python3 -I -S src/daily_automation.py post --action send_success_report --dir automation_out --artifact-url "$ARTIFACT_URL"

      - name: Upload the reports and results
        id: upload_artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daily-market-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/report_*.md
            reports/report_*_data.csv
            automation_out/
          retention-days: 14
          if-no-files-found: warn
        timeout-minutes: 5

      - name: Send the failure notification
        id: notify_failure
        if: failure()
        env:
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          GOOGLE_APPS_SCRIPT_TOKEN: ${{ secrets.GOOGLE_APPS_SCRIPT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          OUTCOME_CHECKOUT: ${{ steps.checkout.outcome }}
          OUTCOME_SETUP_PYTHON: ${{ steps.setup_python.outcome }}
          OUTCOME_INSTALL_DEPENDENCIES: ${{ steps.install_dependencies.outcome }}
          OUTCOME_TESTS: ${{ steps.tests.outcome }}
          OUTCOME_CLEAR_STALE_OUTPUTS: ${{ steps.clear_stale_outputs.outcome }}
          OUTCOME_ANALYSIS: ${{ steps.analysis.outcome }}
          OUTCOME_VALIDATE_OUTPUTS: ${{ steps.validate_outputs.outcome }}
          OUTCOME_BUILD_DASHBOARD: ${{ steps.build_dashboard.outcome }}
          OUTCOME_STAGE_DELIVERABLES: ${{ steps.stage_deliverables.outcome }}
          OUTCOME_PREPARE_PAGES: ${{ steps.prepare_pages.outcome }}
          OUTCOME_PUBLISH_PAGES: ${{ steps.publish_pages.outcome }}
          OUTCOME_BUILD_PAYLOAD: ${{ steps.build_payload.outcome }}
          OUTCOME_POST_TO_SHEET: ${{ steps.post_to_sheet.outcome }}
          OUTCOME_VERIFY_SHEET: ${{ steps.verify_sheet.outcome }}
          OUTCOME_UPLOAD_DELIVERABLES: ${{ steps.upload_deliverables.outcome }}
          OUTCOME_SEND_SUCCESS_EMAIL: ${{ steps.send_success_email.outcome }}
          OUTCOME_UPLOAD_ARTIFACTS: ${{ steps.upload_artifacts.outcome }}

        timeout-minutes: 8
        run: |
          mkdir -p automation_out

          python3 -I -S src/daily_automation.py notify-failure --dir automation_out \
            --run-id "$GITHUB_RUN_ID" --run-url "$RUN_URL" \
            --outcome "checkout=$OUTCOME_CHECKOUT" \
            --outcome "setup_python=$OUTCOME_SETUP_PYTHON" \
            --outcome "install_dependencies=$OUTCOME_INSTALL_DEPENDENCIES" \
            --outcome "tests=$OUTCOME_TESTS" \
            --outcome "clear_stale_outputs=$OUTCOME_CLEAR_STALE_OUTPUTS" \
            --outcome "analysis=$OUTCOME_ANALYSIS" \
            --outcome "validate_outputs=$OUTCOME_VALIDATE_OUTPUTS" \
            --outcome "build_dashboard=$OUTCOME_BUILD_DASHBOARD" \
            --outcome "stage_deliverables=$OUTCOME_STAGE_DELIVERABLES" \
            --outcome "prepare_pages=$OUTCOME_PREPARE_PAGES" \
            --outcome "publish_pages=$OUTCOME_PUBLISH_PAGES" \
            --outcome "build_payload=$OUTCOME_BUILD_PAYLOAD" \
            --outcome "post_to_sheet=$OUTCOME_POST_TO_SHEET" \
            --outcome "verify_sheet=$OUTCOME_VERIFY_SHEET" \
            --outcome "upload_deliverables=$OUTCOME_UPLOAD_DELIVERABLES" \
            --outcome "send_success_email=$OUTCOME_SEND_SUCCESS_EMAIL" \
            --outcome "upload_artifacts=$OUTCOME_UPLOAD_ARTIFACTS"
